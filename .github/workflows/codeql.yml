# CodeQL static analysis
# Author: gurvinny
#
# Advanced setup rather than GitHub's default setup, so the scan configuration
# lives in the repo and reports on every pull request -- including
# dependency-only ones, which default setup skips.
name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "07 5 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` covers the workflow files themselves, which is the rest of
        # what this repo executes.
        language: [ python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
